name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  id-token: write   # NuGet Trusted Publishing: a short-lived key per run, no stored secret
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Tag must equal the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          V=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/Astroway/Astroway.csproj)
          [ "v$V" = "$TAG" ] || { echo "::error ::tag $TAG but csproj Version $V"; exit 1; }
      - run: dotnet test -c Release
      - run: dotnet pack src/Astroway -c Release -o out -p:ContinuousIntegrationBuild=true
      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "out/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --title "$TAG" --notes-from-tag --verify-tag
